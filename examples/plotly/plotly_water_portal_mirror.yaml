layout:
  height: 440
  barmode: group
  bargap: 0.18
  bargroupgap: 0.06
  margin:
    t: 30
    l: 60
    r: 25
    b: 65
  legend:
    orientation: h
    x: 0
    y: 1.08
  xaxis:
    type: category
    categoryorder: array
    categoryarray:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    tickangle: 0
    title:
      text: M.U.D. billing month
  yaxis:
    rangemode: tozero
    title:
      text: CCF
  hovermode: closest
config:
  displayModeBar: false
