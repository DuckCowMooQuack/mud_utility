type: custom:plotly-graph
title: M.U.D. Water Year-over-Year (Portal Mirror)
grid_options:
  columns: full
hours_to_show: 1s
raw_plotly_config: true
entities:
  - entity: sensor.mud_utilities_test_water_consumption
    name: '2024'
    type: bar
    showlegend: true
    x: |-
      $ex {
        const months = [
          "January", "February", "March", "April",
          "May", "June", "July", "August",
          "September", "October", "November", "December"
        ];

        const history = meta.billing_history;

        const records = history.filter((p, i, all) =>
          p.billing_period.startsWith("2024-") &&
          all.map(q => q.billing_period)
             .lastIndexOf(p.billing_period) === i
        );

        return records.map(p =>
          months[
            Number(p.billing_period.split("-")[1]) - 1
          ]
        );
      }
    'y': |-
      $ex {
        const history = meta.billing_history;

        const records = history.filter((p, i, all) =>
          p.billing_period.startsWith("2024-") &&
          all.map(q => q.billing_period)
             .lastIndexOf(p.billing_period) === i
        );

        return records.map(p =>
          Number(p.consumption)
        );
      }
    customdata: |-
      $ex {
        const history = meta.billing_history;

        const records = history.filter((p, i, all) =>
          p.billing_period.startsWith("2024-") &&
          all.map(q => q.billing_period)
             .lastIndexOf(p.billing_period) === i
        );

        return records.map(p => [
          p.billing_period,
          p.start,
          p.end,
          p.unit
        ]);
      }
    hovertemplate: >-
      <b>%{customdata[0]}</b><br> Usage: %{y:.1f} %{customdata[3]}<br> Billing
      cycle: %{customdata[1]} → %{customdata[2]} <extra>2024</extra>
