        }

        return Array.from(grouped.entries())
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([key, item]) => {
            const details =
              item.records
                .map(r =>
                  r.start + " → " + r.end +
                  " (" +
                  Number(r.consumption).toFixed(1) +
                  " " + item.unit +
                  "; " +
                  r.dominantDays + "/" +
                  r.totalDays +
                  " days)"
                )
                .join("<br>");

