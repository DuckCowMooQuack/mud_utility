type: custom:plotly-graph
grid_options:
  columns: full
hours_to_show: 1s
raw_plotly_config: true
entities:
  - entity: sensor.mud_utilities_test_gas_consumption
    name: '2024'
    type: bar
    showlegend: true
    x: |-
      $ex {
        const months = [
          "January", "February", "March", "April",
          "May", "June", "July", "August",
          "September", "October", "November", "December"
        ];

        const parseDate = value => {
          const [y, m, d] = value.split("-").map(Number);
          return new Date(y, m - 1, d);
        };

        const monthKey = date =>
          date.getFullYear() + "-" +
          String(date.getMonth() + 1).padStart(2, "0");

        const dominantMonth = p => {
          const start = parseDate(p.start);
          const end = parseDate(p.end);

          const counts = {};

          for (
            let d = new Date(start);
            d <= end;
            d.setDate(d.getDate() + 1)
          ) {
            const key = monthKey(d);
            counts[key] = (counts[key] || 0) + 1;
          }

          const maxDays =
            Math.max(...Object.values(counts));

          const winners =
            Object.keys(counts).filter(
              key => counts[key] === maxDays
            );

          if (winners.length === 1) {
            return winners[0];
          }

          const midpoint =
            new Date(
              (start.getTime() + end.getTime()) / 2
            );

          const midpointKey = monthKey(midpoint);

          return winners.includes(midpointKey)
            ? midpointKey
            : winners[0];
        };

        const grouped = new Map();

        for (const p of meta.billing_history) {
          const key = dominantMonth(p);

          if (!key.startsWith("2024-")) {
            continue;
          }

          const item =
            grouped.get(key) || {
              consumption: 0,
              records: []
            };

          item.consumption +=
            Number(p.consumption);

          item.records.push(p);

          grouped.set(key, item);
        }

        return Array.from(grouped.entries())
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([key]) =>
            months[Number(key.split("-")[1]) - 1]
          );
      }
    'y': |-
      $ex {
        const parseDate = value => {
          const [y, m, d] = value.split("-").map(Number);
          return new Date(y, m - 1, d);
        };

        const monthKey = date =>
          date.getFullYear() + "-" +
          String(date.getMonth() + 1).padStart(2, "0");

        const dominantMonth = p => {
          const start = parseDate(p.start);
          const end = parseDate(p.end);

          const counts = {};

          for (
            let d = new Date(start);
            d <= end;
            d.setDate(d.getDate() + 1)
          ) {
            const key = monthKey(d);
            counts[key] = (counts[key] || 0) + 1;
          }

          const maxDays =
            Math.max(...Object.values(counts));

          const winners =
            Object.keys(counts).filter(
              key => counts[key] === maxDays
            );

          if (winners.length === 1) {
            return winners[0];
          }

          const midpoint =
            new Date(
              (start.getTime() + end.getTime()) / 2
            );

          const midpointKey = monthKey(midpoint);

          return winners.includes(midpointKey)
            ? midpointKey
            : winners[0];
        };

        const grouped = new Map();

        for (const p of meta.billing_history) {
          const key = dominantMonth(p);

          if (!key.startsWith("2024-")) {
            continue;
          }

          grouped.set(
            key,
            (grouped.get(key) || 0) +
            Number(p.consumption)
          );
        }

        return Array.from(grouped.entries())
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([, value]) => value);
      }
    customdata: |-
      $ex {
        const parseDate = value => {
          const [y, m, d] = value.split("-").map(Number);
          return new Date(y, m - 1, d);
