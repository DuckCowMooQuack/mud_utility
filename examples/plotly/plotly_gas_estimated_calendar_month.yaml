layout:
  height: 460
  title:
    text: <b>M.U.D. Gas — Estimated Calendar Month Comparison</b>
    x: 0.02
    xanchor: left
    subtitle:
      text: >-
        Estimated month = calendar month containing the most days in each M.U.D.
        billing cycle. Hover for the source period.
      font:
        size: 11
  barmode: group
  bargap: 0.18
  bargroupgap: 0.06
  margin:
    t: 70
    l: 60
    r: 25
    b: 115
  legend:
    orientation: h
    x: 0
    y: 1.08
  xaxis:
    type: category
    categoryorder: array
    categoryarray:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    tickangle: 0
    title:
      text: Estimated calendar month
  yaxis:
    rangemode: tozero
    title:
      text: TH
  hovermode: closest
  annotations:
    xref: paper
    yref: paper
    x: 0.5
    y: -0.25
    showarrow: false
    xanchor: center
    font:
      size: 11
config:
  displayModeBar: false
